services:
  - type: web
    name: technomate-backend
    runtime: python
    plan: free
    region: frankfurt  # Closest to Athens
    buildCommand: "pip install -r backend/requirements.txt"
    startCommand: "cd backend && python -m uvicorn main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: OPENAI_API_KEY
        sync: false  # Set manually in Render dashboard for security
      - key: COHERE_API_KEY
        sync: false  # Optional
      - key: TAVILY_API_KEY
        sync: false
      - key: QDRANT_URL
        sync: false  # Optional - Qdrant Cloud URL
      - key: QDRANT_API_KEY
        sync: false  # Optional - Qdrant Cloud API key
